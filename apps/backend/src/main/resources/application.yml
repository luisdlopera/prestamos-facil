server:
  port: ${HTTP_PORT:4010}
  forward-headers-strategy: framework

spring:
  profiles:
    default: email
  application:
    name: prestamos-facil-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:prestamos_facil}
    username: ${DB_USERNAME:prestamos}
    password: ${DB_PASSWORD:prestamos_local}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    repair-on-migrate: false
    out-of-order: false


  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:4025}
    username: ${MAIL_USERNAME:noreply@prestamosfacil.local}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  frontend-url: ${FRONTEND_URL:http://localhost:4000}
  cors:
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:4000}
  mail:
    resend-api-key: ${RESEND_API_KEY:}
  security:
    jwt-secret: ${JWT_SECRET:dev-secret-replace-in-production-at-least-32-chars}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7
    jwt-clock-skew-seconds: 30
    cookie:
      secure: false
      same-site: Lax
      access-name: prestamos_access
      refresh-name: prestamos_refresh
      path: /
      http-only: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    com.prestamosfacil: INFO
    org.springframework: WARN
    org.hibernate: WARN
    org.flywaydb: DEBUG
