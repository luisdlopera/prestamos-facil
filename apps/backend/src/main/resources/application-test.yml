spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false
    defer-datasource-initialization: true
  flyway:
    enabled: false
  sql:
    init:
      mode: always

app:
  security:
    jwt-secret: dev-test-secret-at-least-32-characters-long-for-hs256

logging:
  level:
    com.prestamosfacil: DEBUG
