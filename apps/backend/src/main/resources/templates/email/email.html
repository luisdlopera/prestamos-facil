<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Préstamos Fácil</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased;">

<table align="center" border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px; margin: 30px auto; background-color: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04); border: 1px solid #e2e8f0;">

    <!-- HEADER -->
    <tr>
        <td style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); padding: 36px 32px; text-align: center; border-bottom: 4px solid #2563eb;">
            <div style="display: inline-block; padding: 6px 16px; background: rgba(37, 99, 235, 0.15); border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 20px; margin-bottom: 12px;">
                <span style="color: #60a5fa; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;">PRÉSTAMOS FÁCIL</span>
            </div>
            <h1 th:text="${title != null ? title : 'Préstamos Fácil'}" style="color: #ffffff; font-size: 24px; font-weight: 700; margin: 0; letter-spacing: -0.5px;">
                Notificación Importante
            </h1>
            <p th:if="${subtitle != null}" th:text="${subtitle}" style="color: #94a3b8; font-size: 14px; margin: 8px 0 0 0; font-weight: 400;">
                Información de tu cuenta
            </p>
        </td>
    </tr>

    <!-- CONTENT -->
    <tr>
        <td style="padding: 36px 32px; color: #334155; line-height: 1.6;">
            <div th:utext="${content}" style="font-size: 15px; color: #334155;">
            </div>

            <table th:if="${action != null}" border="0" cellpadding="0" cellspacing="0" width="100%" style="margin-top: 32px;">
                <tr>
                    <td align="center">
                        <a th:href="${action.url}" th:text="${action.title}"
                           style="background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: #ffffff; padding: 14px 32px; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 14px; display: inline-block; box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3); transition: all 0.2s ease;">
                            Ver Detalles
                        </a>
                        <p style="font-size: 12px; color: #94a3b8; margin-top: 10px;">Haz clic para ingresar de forma segura</p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <!-- FOOTER -->
    <tr>
        <td style="padding: 24px 32px; background-color: #f8fafc; text-align: center; border-top: 1px solid #e2e8f0;">
            <p th:if="${footer != null}" th:text="${footer}" style="font-size: 12px; color: #64748b; margin: 0; font-weight: 500;">
                Préstamos Fácil - Todos los derechos reservados
            </p>
            <div style="margin-top: 10px; display: inline-block; padding: 4px 12px; background-color: #f0fdf4; border-radius: 12px; border: 1px solid #bbf7d0;">
                <span style="font-size: 11px; color: #166534; font-weight: 600;">
                    🔒 Correo oficial y seguro transmitido por Préstamos Fácil
                </span>
            </div>
        </td>
    </tr>
</table>
</body>
</html>
